<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thermal Viewer</title>
<style>
  :root {
    --bg: #f6f5f1; --fg: #1f1f1c; --muted: #5f5e57; --line: #d6d4cc; --card: #ffffff; --accent: #c8442f;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #161614; --fg: #ecebe6; --muted: #a3a197; --line: #3a3934; --card: #201f1c; }
  }
  :root[data-theme="dark"] { --bg: #161614; --fg: #ecebe6; --muted: #a3a197; --line: #3a3934; --card: #201f1c; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.4 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p.sub { margin: 0 0 14px; color: var(--muted); font-size: 13px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  button { font: inherit; padding: 6px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--fg); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  label { font-size: 13px; color: var(--muted); display: inline-flex; gap: 4px; align-items: center; }
  input[type=number] { width: 64px; font: inherit; padding: 4px; border: 1px solid var(--line); border-radius: 4px; background: var(--card); color: var(--fg); }
  .view { position: relative; width: 100%; aspect-ratio: 4 / 3; background: #000; border-radius: 8px; overflow: hidden; }
  canvas#img { width: 100%; height: 100%; display: block; }
  .crosshair { position: absolute; left: 50%; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; border: 2px solid rgba(255,255,255,.8); border-radius: 50%; pointer-events: none; }
  .scale { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .scale span { white-space: nowrap; }
  canvas#bar { flex: 1; min-width: 0; width: 100%; height: 12px; border-radius: 3px; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 8px; }
  .stat b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 12px; color: var(--muted); }
  #status { font-size: 13px; color: var(--muted); margin-top: 10px; }
  @media (max-width: 520px) { .stats { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>
<main>
  <h1>pit-pyro thermal viewer</h1>
  <p class="sub">Live image from the MLX90640 over the Feather's USB-C port. Chrome or Edge (Web Serial). Close any serial monitor first.</p>
  <div class="bar">
    <button class="primary" id="connect">Connect</button>
    <button id="rotate">Rotate 90°</button>
    <button id="mirror">Mirror</button>
    <button id="smooth">Smooth: on</button>
    <label><input type="checkbox" id="fixed"> fixed range</label>
    <label>min <input type="number" id="lo" value="20" step="1"></label>
    <label>max <input type="number" id="hi" value="40" step="1"></label>
  </div>
  <div class="view"><canvas id="img" width="640" height="480"></canvas><div class="crosshair"></div></div>
  <div class="scale"><span id="scaleLo">–</span><canvas id="bar" width="256" height="1"></canvas><span id="scaleHi">–</span></div>
  <div class="stats">
    <div class="stat"><b id="sCentre">–</b><span>centre °C</span></div>
    <div class="stat"><b id="sMin">–</b><span>min °C</span></div>
    <div class="stat"><b id="sMax">–</b><span>max °C</span></div>
    <div class="stat"><b id="sRate">–</b><span>images / s</span></div>
  </div>
  <div id="status">Not connected.</div>
</main>
<script>
const W = 32, H = 24;
const $ = (id) => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
let rotation = store.get('rotation', 0), mirror = store.get('mirror', false), smooth = store.get('smooth', true);
let last = null, times = [];

// Black, purple, magenta, orange, yellow, white: an "iron" palette.
const STOPS = [[0, [0, 0, 0]], [0.2, [40, 0, 120]], [0.45, [180, 0, 140]], [0.7, [240, 90, 0]], [0.9, [255, 210, 0]], [1, [255, 255, 230]]];
function colour(t) {
  t = Math.min(1, Math.max(0, t));
  for (let i = 1; i < STOPS.length; i++) {
    const [a, ca] = STOPS[i - 1], [b, cb] = STOPS[i];
    if (t <= b) { const f = (t - a) / (b - a); return ca.map((c, k) => Math.round(c + (cb[k] - c) * f)); }
  }
  return STOPS[STOPS.length - 1][1];
}
(function drawBar() {
  const c = $('bar').getContext('2d'), d = c.createImageData(256, 1);
  for (let x = 0; x < 256; x++) { const [r, g, b] = colour(x / 255); d.data.set([r, g, b, 255], x * 4); }
  c.putImageData(d, 0, 0);
})();

function draw(t) {
  last = t;
  let lo = Math.min(...t), hi = Math.max(...t);
  const mean = (a) => a.reduce((s, v) => s + v, 0) / a.length;
  const centre = mean([t[11 * W + 15], t[11 * W + 16], t[12 * W + 15], t[12 * W + 16]]);
  $('sMin').textContent = lo.toFixed(1); $('sMax').textContent = hi.toFixed(1); $('sCentre').textContent = centre.toFixed(1);
  if ($('fixed').checked) { lo = +$('lo').value; hi = +$('hi').value; }
  else if (hi - lo < 2) { const m = (hi + lo) / 2; lo = m - 1; hi = m + 1; }
  $('scaleLo').textContent = lo.toFixed(1) + ' °C'; $('scaleHi').textContent = hi.toFixed(1) + ' °C';

  const quarter = rotation % 2 === 1, w = quarter ? H : W, h = quarter ? W : H;
  const small = document.createElement('canvas'); small.width = w; small.height = h;
  const sc = small.getContext('2d'), d = sc.createImageData(w, h);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    let px = mirror ? W - 1 - x : x, py = y, ox, oy;
    switch (rotation) {
      case 0: ox = px; oy = py; break;
      case 1: ox = H - 1 - py; oy = px; break;
      case 2: ox = W - 1 - px; oy = H - 1 - py; break;
      default: ox = py; oy = W - 1 - px;
    }
    const [r, g, b] = colour((t[y * W + x] - lo) / (hi - lo));
    d.data.set([r, g, b, 255], (oy * w + ox) * 4);
  }
  sc.putImageData(d, 0, 0);
  const view = $('img'); view.width = quarter ? 480 : 640; view.height = quarter ? 640 : 480;
  view.parentElement.style.aspectRatio = quarter ? '3 / 4' : '4 / 3';
  const vc = view.getContext('2d'); vc.imageSmoothingEnabled = smooth; vc.drawImage(small, 0, 0, view.width, view.height);

  const now = performance.now(); times.push(now); times = times.filter((x) => now - x < 5000);
  if (times.length > 1) $('sRate').textContent = ((times.length - 1) / ((now - times[0]) / 1000)).toFixed(1);
}

$('rotate').onclick = () => { rotation = (rotation + 1) % 4; store.set('rotation', rotation); if (last) draw(last); };
$('mirror').onclick = () => { mirror = !mirror; store.set('mirror', mirror); if (last) draw(last); };
$('smooth').onclick = () => { smooth = !smooth; store.set('smooth', smooth); $('smooth').textContent = 'Smooth: ' + (smooth ? 'on' : 'off'); if (last) draw(last); };
$('smooth').textContent = 'Smooth: ' + (smooth ? 'on' : 'off');

$('connect').onclick = async () => {
  if (!('serial' in navigator)) { $('status').textContent = 'This browser has no Web Serial. Use Chrome or Edge.'; return; }
  let port;
  try { port = await navigator.serial.requestPort(); await port.open({ baudRate: 115200 }); }
  catch (e) { $('status').textContent = 'Could not open the port: ' + e.message; return; }
  $('connect').disabled = true; $('status').textContent = 'Connected. Waiting for images…';
  const writer = port.writable.getWriter(), enc = new TextEncoder();
  const ask = () => writer.write(enc.encode('frame csv\r'));
  const reader = port.readable.pipeThrough(new TextDecoderStream()).getReader();
  let buf = '', rows = [], lastAsk = 0;
  await writer.write(enc.encode('\r')); await ask(); lastAsk = performance.now();
  // If an answer goes missing (say, the board restarted), ask again.
  setInterval(() => { if (performance.now() - lastAsk > 3000) { rows = []; ask(); lastAsk = performance.now(); } }, 1000);
  try {
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += value;
      const lines = buf.split(/\r?\n/); buf = lines.pop();
      for (const line of lines) {
        const parts = line.trim().split(',');
        if (parts.length === W && parts.every((p) => p !== '' && !isNaN(p))) {
          rows.push(parts.map(Number));
          if (rows.length === H) { draw(rows.flat()); rows = []; ask(); lastAsk = performance.now(); $('status').textContent = 'Live.'; }
        } else if (line.includes('no sensor')) {
          $('status').textContent = 'The Feather says: ' + line.trim();
        }
      }
    }
  } catch (e) { $('status').textContent = 'Disconnected: ' + e.message; $('connect').disabled = false; }
};
</script>
</body>
</html>
